<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>đăng ký</title>
    <link rel="stylesheet" href="../css/dangki.css">
     <link rel="icon" type="image/png" sizes="16x16" href="../imgandvd/favicon-16x16.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
   


</head>
<body> 
  <nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <h2>Remember English</h2> 
        </div>
        <ul class="nav-links">
            <li><a href="./gioithieu.html" class="btn-nav-login">Giới thiệu</a></li>
        </ul>
    </div>
</nav>

   
   <div class="login-box">
        <div class="auth-tabs">
            <a href="./login.html" class="tab-link">Đăng nhập</a>
            <a href="./dangki.html" class="tab-link active">Đăng ký</a>
        </div>

        <form id="registerForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Tên người dùng (ít nhất 6 ký tự)" required>
            </div>

            <div class="input-group">
                <input type="email" id="email" placeholder="Địa chỉ Email" required>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Mật khẩu (ít nhất 8 ký tự)" required>
            </div>

            <button type="submit" class="btn-signin">Tạo tài khoản</button>
            
            <div class="form-help">
                <span>Đã có tài khoản? <a href="./login.html" class="link-back">Đăng nhập ngay</a></span>
            </div>
        </form>
    </div>
   
     
<script type="module"  src="../js/dangki.js"></script>
</body>
</html>
